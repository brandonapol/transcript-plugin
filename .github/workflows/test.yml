name: test

on:
  push:
  pull_request:

jobs:
  cues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rank and parse transcripts
        run: node --experimental-strip-types --test src/lib/cues.test.ts
